<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <style>
    body {
      max-width: 720px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.6;
      color: #222;
    }

    img {
      display: block;
      max-width: 240px;
      width: 100%;
      height: auto;
      margin: 0 0 32px;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }

    a {
      color: inherit;
    }

    @media (max-width: 600px) {
      body {
        margin: 30px auto;
      }
    }
  </style>
</head>

<body>
  {{ content }}
</body>
</html>
